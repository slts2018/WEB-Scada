server:
  port: ${PORT:8787}
  address: ${HOST:0.0.0.0}

spring:
  application:
    name: web-scada-server
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

webscada:
  mysql:
    host: ${MYSQL_HOST:127.0.0.1}
    port: ${MYSQL_PORT:3306}
    user: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    database: ${MYSQL_DATABASE:web_scada}
    fallback-to-file: ${MYSQL_FALLBACK_FILE:true}
  influx:
    url: ${INFLUX_URL:http://127.0.0.1:8086}
    token: ${INFLUX_TOKEN:}
    org: ${INFLUX_ORG:web-scada}
    bucket: ${INFLUX_BUCKET:tags}
    measurement: ${INFLUX_MEASUREMENT:tag_value}
    required: ${INFLUX_REQUIRED:false}
  auth:
    api-token: ${SCADA_API_TOKEN:}
    required: ${SCADA_AUTH_REQUIRED:false}
  mcd4000:
    enabled: ${MCD4000_ENABLED:true}
    # 无采集点时的连通探测间隔。有变量时按各变量扫描周期查询。
    poll-ms: ${MCD4000_POLL_MS:2000}
    lookback-sec: ${MCD4000_LOOKBACK_SEC:604800}
    timeout-ms: ${MCD4000_TIMEOUT_MS:15000}
    # 数据中台 HTTPS 证书常不被 JVM 信任；默认放行，可用 MCD4000_INSECURE_SSL=false 关闭
    insecure-ssl: ${MCD4000_INSECURE_SSL:true}
  # 设备协议 modbus_tcp：按变量扫描周期读点。poll-ms 只用于没有采集点时的连通探测。
  modbus:
    enabled: ${MODBUS_ENABLED:true}
    poll-ms: ${MODBUS_POLL_MS:1000}
    unit-id: ${MODBUS_UNIT_ID:1}
    connect-timeout-ms: ${MODBUS_CONNECT_TIMEOUT_MS:800}
    response-timeout-ms: ${MODBUS_RESPONSE_TIMEOUT_MS:2000}
    low-word-first: ${MODBUS_LOW_WORD_FIRST:true}
    # isolated=每设备独立队列（默认）；legacy=全局串行（回滚）
    scheduler: ${MODBUS_SCHEDULER:isolated}
    # 设备连失败后冷却，冷却期内不发起 TCP
    device-cooldown-ms: ${MODBUS_DEVICE_COOLDOWN_MS:3000}
    max-fail-before-cooldown: ${MODBUS_MAX_FAIL_BEFORE_COOLDOWN:1}
    # 逐点成功 DEBUG；掉线/写值/点失败仍走 INFO/WARN
    trace: ${MODBUS_TRACE:false}
  # 通信骨架默认关闭，避免没有链路配置时启动失败。打开后才会拉起 Supervisor。
  comm:
    enabled: false
