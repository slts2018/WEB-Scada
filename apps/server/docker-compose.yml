services:
  influxdb:
    image: influxdb:2.7
    container_name: web-scada-influx
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminadmin
      DOCKER_INFLUXDB_INIT_ORG: web-scada
      DOCKER_INFLUXDB_INIT_BUCKET: tags
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: web-scada-dev-token
      DOCKER_INFLUXDB_INIT_RETENTION: 0
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
    restart: unless-stopped

volumes:
  influx-data:
  influx-config:
